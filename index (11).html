<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chamego — Kanban Operacional</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap');

  :root {
    --bg: #fdf6ec;
    --panel: #ffffff;
    --panel-soft: #fbeee0;
    --panel-hover: #f5e0c9;
    --line: rgba(20,33,61,0.14);
    --text: #1c2947;
    --text-soft: #4a5570;
    --muted: #8d93a6;
    --accent: #2f9e8c;
    --accent-soft: rgba(47,158,140,0.14);
    --butter: #ee4e2e;
    --butter-deep: #c93e22;
    --butter-text: #ffffff;
    --danger: #b8402c;
    --danger-soft: rgba(184,64,44,0.13);
    --ok: #4f8a3f;
    --ok-soft: rgba(79,138,63,0.14);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    position: relative;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1100px 460px at 8% -8%, rgba(238,78,46,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(47,158,140,0.09), transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  header, nav.tabs, .filter-bar, .stats-row, main { position: relative; z-index: 1; }

  header {
    padding: 22px clamp(16px, 4vw, 44px) 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo-badge {
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand .logo-badge img {
    height: clamp(64px, 10vw, 92px); width: auto; display: block;
    filter: drop-shadow(0 1px 3px rgba(28,41,71,0.20));
  }
  .brand .brand-text { display: flex; flex-direction: column; gap: 3px; }
  .brand .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(24px, 3.4vw, 34px);
    color: var(--text);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .brand .tag { font-size: 12.5px; color: var(--muted); }

  .sync-status {
    font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 6px;
    padding: 5px 10px 5px 8px; border-radius: 20px; background: var(--ok-soft); color: var(--ok);
  }
  .sync-status.local { background: var(--accent-soft); color: var(--accent); }
  .sync-status .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn {
    font-family: inherit; font-size: 13.5px; font-weight: 700; border-radius: 9px;
    border: 1px solid transparent; padding: 9px 15px; cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease; white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--butter); color: var(--butter-text); }
  .btn-primary:hover { background: var(--butter-deep); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--text); }
  .btn-ghost:hover { background: rgba(120,60,30,0.06); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  nav.tabs { display: flex; gap: 6px; padding: 14px clamp(16px, 4vw, 44px) 0; overflow-x: auto; }
  .tab-btn {
    font-family: inherit; font-size: 13.5px; font-weight: 700; background: transparent; border: none;
    color: var(--muted); padding: 9px 4px; cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text-soft); }
  .tab-btn svg, .dm-btn svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; flex-shrink: 0; }

  /* ---------- Filter bar & stats ---------- */
  .filter-bar { padding: 14px clamp(16px, 4vw, 44px) 0; display: flex; flex-direction: column; gap: 10px; }
  .person-filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 3px; }
  .pf-chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 20px;
    padding: 6px 10px 6px 13px; font-size: 12.5px; font-weight: 700; color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .pf-chip:hover { border-color: var(--accent); }
  .pf-chip .pf-count { color: var(--muted); font-weight: 600; }
  .pf-chip.active { background: var(--butter); border-color: var(--butter); color: var(--butter-text); }
  .pf-chip.active .pf-count { color: rgba(58,36,16,0.65); }
  .pf-chip.add { border-style: dashed; color: var(--muted); font-weight: 700; background: transparent; }
  .pf-chip.add:hover { color: var(--text); }

  .stats-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px clamp(16px, 4vw, 44px) 0; }
  .stats-month-lbl { font-size: 11.5px; color: var(--muted); width: 100%; margin-bottom: 2px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; min-width: 118px; }
  .stat-card .stat-num { font-family: 'Fraunces', serif; font-size: 21px; color: var(--accent); line-height: 1; }
  .stat-card .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

  main { padding: 18px clamp(16px, 4vw, 44px) 44px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Date-mode toggle ---------- */
  .datemode-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
  .dm-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 20px;
    border: 1.5px solid var(--line); background: var(--panel); color: var(--text-soft); cursor: pointer;
  }
  .dm-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* ---------- Weekly panel ---------- */
  .week-panel { background: var(--panel-soft); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 26px; }
  .week-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .week-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16.5px; color: var(--text); }
  .week-nav { display: flex; gap: 6px; align-items: center; }

  .format-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .format-tab {
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 20px;
    border: 1.5px solid var(--line); background: var(--panel); color: var(--text-soft); cursor: pointer;
  }
  .format-tab.ft-reels.active     { background: rgba(219,165,86,0.24); border-color: #c9973f; color: #7a4f14; }
  .format-tab.ft-carrossel.active { background: rgba(124,147,201,0.22); border-color: #7c93c9; color: #3d4f8a; }
  .format-tab.ft-story.active     { background: rgba(185,139,224,0.22); border-color: #a973d1; color: #6b3fa0; }
  .format-tab.ft-imagem.active    { background: rgba(111,207,151,0.22); border-color: #4fa876; color: #2f7a52; }

  .week-scroll { overflow-x: auto; }
  .week-grid { display: grid; grid-template-columns: repeat(7, minmax(126px, 1fr)); gap: 8px; min-width: 880px; }
  .week-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 96px; cursor: pointer; }
  .week-cell.today { border-color: var(--accent); background: rgba(233,199,101,0.14); }
  .week-cell-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .week-dow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .week-daynum { font-size: 12.5px; font-weight: 700; color: var(--text); margin-left: 4px; }
  .week-cell-list { display: flex; flex-direction: column; gap: 4px; }
  .week-empty { font-size: 11px; color: var(--muted); text-align: center; padding: 10px 0; }

  /* ---------- Calendar (monthly) ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .cal-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px; color: var(--text); min-width: 190px; }
  .cal-nav, .week-nav { display: flex; gap: 6px; align-items: center; }
  .nav-btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--panel-hover); }

  .cal-scroll { overflow-x: auto; padding-bottom: 4px; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, minmax(122px, 1fr));
    min-width: 860px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .cal-weekday { background: var(--panel-soft); font-size: 11px; font-weight: 700; color: var(--text-soft); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .cal-cell {
    background: var(--panel); min-height: 108px;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 5px; position: relative; cursor: pointer;
  }
  .cal-grid .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.outside { background: rgba(120,80,50,0.055); }
  .cal-cell.today { background: rgba(233,199,101,0.14); }
  .cal-daynum-row { display: flex; align-items: center; justify-content: space-between; }
  .cal-daynum { font-size: 12px; font-weight: 700; color: var(--text); }
  .cal-cell.outside .cal-daynum { color: var(--muted); }
  .cal-cell.today .cal-daynum {
    background: var(--accent); color: #fff; border-radius: 50%;
    width: 19px; height: 19px; display: flex; align-items: center; justify-content: center;
  }
  .cal-add { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; line-height: 1; padding: 0 2px; opacity: 0; }
  .cal-cell:hover .cal-add { opacity: 1; }
  .cal-add:hover { color: var(--text); }

  .cal-chips { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; max-height: 76px; }
  .chip {
    font-size: 10.8px; font-weight: 700; padding: 3px 6px; border-radius: 6px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid transparent;
  }
  .chip:hover { filter: brightness(1.08); }

  .fmt-reels     { background: rgba(219,165,86,0.22); color: #7a4f14; border-left-color: #dba556; }
  .fmt-carrossel { background: rgba(124,147,201,0.20); color: #3d4f8a; border-left-color: #7c93c9; }
  .fmt-story     { background: rgba(185,139,224,0.20); color: #6b3fa0; border-left-color: #b98be0; }
  .fmt-imagem    { background: rgba(111,207,151,0.20); color: #2f7a52; border-left-color: #6fcf97; }

  .cal-more { font-size: 10.5px; color: var(--muted); padding-left: 6px; }

  /* ---------- Pills ---------- */
  .stage-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .stage-backlog   { background: rgba(74,85,112,0.14); color: #4a5570; }
  .stage-afazer    { background: rgba(47,158,140,0.18); color: #1f6e60; }
  .stage-fazendo   { background: rgba(238,78,46,0.18); color: #a8371f; }
  .stage-travado   { background: rgba(232,117,106,0.20); color: #a83f2e; }
  .stage-concluido { background: rgba(125,191,104,0.22); color: #3f7a2d; }

  .prio-pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .prio-alta  { background: rgba(232,117,106,0.20); color: #a83f2e; }
  .prio-media { background: rgba(219,165,86,0.24); color: #7a4f14; }
  .prio-baixa { background: rgba(125,191,104,0.20); color: #3f7a2d; }

  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    font-size: 10px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    border: 1px solid rgba(233,199,101,0.35);
  }

  .empty-hint { color: var(--muted); font-size: 13.5px; padding: 30px 4px; border: 1.5px dashed var(--line); border-radius: 12px; text-align: center; }

  /* ---------- Individual board ---------- */
  .indiv-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .indiv-head h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--text); margin: 0; }

  .indiv-board-scroll { overflow-x: auto; padding-bottom: 8px; }
  .indiv-board { display: flex; gap: 14px; align-items: flex-start; }
  .indiv-col {
    background: var(--panel-soft); border: 1px solid var(--line); border-radius: 14px;
    min-width: 232px; max-width: 232px; display: flex; flex-direction: column;
    max-height: calc(100vh - 340px); min-height: 220px;
  }
  .indiv-col.drag-over { border-color: var(--accent); background: rgba(233,199,101,0.14); }
  .indiv-col-head { padding: 12px 12px 9px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); gap: 6px; }
  .indiv-col-head h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 13px; margin: 0; color: var(--text); }
  .indiv-count { font-size: 11px; color: var(--muted); background: rgba(120,60,30,0.08); padding: 2px 7px; border-radius: 20px; flex-shrink: 0; }
  .indiv-cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 50px; flex: 1; }
  .indiv-cards:empty::after {
    content: 'Arraste um card para cá'; font-size: 11px; color: var(--muted); text-align: center;
    padding: 14px 4px; display: block; border: 1.5px dashed var(--line); border-radius: 8px;
  }
  .indiv-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: grab; display: flex; flex-direction: column; gap: 6px; }
  .indiv-card:active { cursor: grabbing; }
  .indiv-card.dragging { opacity: 0.4; }
  .ic-top { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .ic-title { font-size: 12.8px; font-weight: 700; line-height: 1.3; color: var(--text); }
  .ic-meta { font-size: 10.8px; color: var(--muted); }
  .ic-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .move-btns { display: flex; gap: 4px; }
  .move-btn {
    background: none; border: 1px solid var(--line); color: var(--text-soft);
    width: 21px; height: 21px; border-radius: 6px; cursor: pointer; font-size: 10.5px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .move-btn:hover:not(:disabled) { background: rgba(120,60,30,0.07); }
  .move-btn:disabled { opacity: 0.22; cursor: default; }
  .ic-actions { display: flex; gap: 2px; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 12px; padding: 2px 4px; border-radius: 5px; }
  .icon-btn:hover { color: var(--text); background: rgba(120,60,30,0.08); }
  .indiv-add-col {
    margin: 0 10px 10px; background: transparent; border: 1.5px dashed var(--line); color: var(--muted);
    border-radius: 9px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .indiv-add-col:hover { border-color: var(--accent); color: var(--text); }

  /* ---------- Completed & progress ---------- */
  .day-group { margin-bottom: 22px; }
  .day-group-head {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--text);
    margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .completed-row {
    display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 7px; cursor: pointer; flex-wrap: wrap;
  }
  .completed-row:hover { border-color: var(--accent); }
  .completed-row .check { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .completed-row .task-title { font-size: 13.5px; }

  .progress-row { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .progress-row:hover { border-color: var(--accent); }
  .progress-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .progress-track { height: 6px; background: rgba(120,60,30,0.10); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; background: var(--accent); }
  .progress-fill.overdue { background: var(--danger); }
  .deadline-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .deadline-ok { background: var(--ok-soft); color: #3f7a2d; }
  .deadline-today { background: var(--accent-soft); color: #8a3d22; }
  .deadline-overdue { background: var(--danger-soft); color: #8a2c1c; }
  .task-title { font-size: 13.5px; font-weight: 700; color: var(--text); }

  /* ---------- Mural ---------- */
  .mural-composer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 10px; }
  .mural-composer select {
    font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); color: var(--text); max-width: 220px;
  }
  .mural-composer textarea {
    font-family: inherit; font-size: 13.5px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; min-height: 56px; resize: vertical; background: var(--panel-soft); color: var(--text);
  }
  .mural-post { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; }
  .mural-post .mp-body { flex: 1; min-width: 0; }
  .mural-post .mp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .mural-post .mp-name { font-weight: 700; font-size: 13px; color: var(--accent); }
  .mural-post .mp-time { font-size: 11px; color: var(--muted); }
  .mural-post .mp-text { font-size: 13.5px; color: var(--text); white-space: pre-wrap; }
  .mural-post .icon-btn { margin-left: auto; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,4,7,0.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
    padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .overlay.open { display: flex; }
  #personOverlay, #categoryOverlay, #confirmOverlay { z-index: 60; }
  .people-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .people-row:last-child { border-bottom: none; }
  .people-row .pr-info { flex: 1; min-width: 0; }
  .people-row .pr-name { font-weight: 700; font-size: 13.5px; color: var(--text); }
  .people-row .pr-wa { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 440px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); max-height: 88vh; overflow-y: auto; }
  .modal h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 19px; margin: 0 0 16px; color: var(--text); }
  .modal p { font-size: 13.5px; color: var(--text-soft); }
  .field { margin-bottom: 14px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input[type=text], .field input[type=date], .field input[type=tel], .field textarea, .field select {
    width: 100%; font-family: inherit; font-size: 14px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); color: var(--text);
  }
  .field textarea { min-height: 58px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .field-hint { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .delete-link { color: var(--danger); background: none; border: none; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: auto; padding: 8px 4px; }
  .delete-link:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    header { padding: 18px 16px 12px; }
    nav.tabs { padding: 12px 16px 0; }
    .filter-bar { padding: 12px 16px 0; }
    .stats-row { padding: 10px 16px 0; }
    main { padding: 14px 16px 36px; }
    .field-row { flex-direction: column; gap: 0; }
    .indiv-col { min-width: 78vw; max-width: 78vw; }
    .week-panel { padding: 12px; }
  }
</style>

    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.toggle("active", b.dataset.tab === tab); });
    document.querySelectorAll(".view").forEach(function (v) { v.classList.toggle("active", v.id === "view-" + tab); });
    var showFilters = tab !== "mural";
    document.getElementById("filterBar").style.display = showFilters ? "flex" : "none";
    document.getElementById("statsRow").style.display = showFilters ? "flex" : "none";
    renderCurrentTab();
  }

  function renderCurrentTab() {
    renderFilterBar();
    renderStats();
    if (currentTab === "calendar") { renderWeekCalendar(); renderMonthCalendar(); }
    else if (currentTab === "team") renderTeam();
    else if (currentTab === "completed") renderCompleted();
    else if (currentTab === "progress") renderProgress();
    else if (currentTab === "mural") renderMural();
  }

  // ---------- Filtering (person only) ----------
  function matchesFilters(t, includePerson) {
    if (includePerson && filters.personId !== "all" && t.ownerId !== filters.personId) return false;
    return true;
  }
  function filteredTasks(includePerson) { return state.tasks.filter(function (t) { return matchesFilters(t, includePerson !== false); }); }

  function renderFilterBar() {
    var pf = document.getElementById("personFilters");
    pf.innerHTML = "";
    var base = filteredTasks(false);
    var totalAll = base.length;
    var counts = {};
    state.people.forEach(function (p) { counts[p.id] = 0; });
    base.forEach(function (t) { if (counts[t.ownerId] !== undefined) counts[t.ownerId]++; });

    var allChip = document.createElement("div");
    allChip.className = "pf-chip" + (filters.personId === "all" ? " active" : "");
    allChip.innerHTML = 'Todos <span class="pf-count">' + totalAll + '</span>';
    allChip.addEventListener("click", function () { filters.personId = "all"; renderCurrentTab(); });
    pf.appendChild(allChip);

    state.people.forEach(function (p) {
      var chip = document.createElement("div");
      chip.className = "pf-chip" + (filters.personId === p.id ? " active" : "");
      chip.innerHTML = p.name + ' <span class="pf-count">' + counts[p.id] + '</span>';
      chip.addEventListener("click", function () { filters.personId = p.id; renderCurrentTab(); });
      pf.appendChild(chip);
    });

    var addChip = document.createElement("div");
    addChip.className = "pf-chip add"; addChip.textContent = "+ Pessoa";
    addChip.addEventListener("click", function () { openPeopleManager(); });
    pf.appendChild(addChip);
  }

  // ---------- Stats (by month, based on the month shown in the monthly calendar) ----------
  function renderStats() {
    var monthTasks = filteredTasks(true).filter(function (t) {
      if (!t.postDate) return false;
      var dt = parseISO(t.postDate);
      return dt.getFullYear() === viewYear && dt.getMonth() === viewMonth;
    });
    var total = monthTasks.length;
    var pendentes = monthTasks.filter(function (t) { return t.stage !== "Concluído"; }).length;
    var emProducao = monthTasks.filter(function (t) { return t.stage === "Fazendo"; }).length;
    var concluidas = monthTasks.filter(function (t) { return t.stage === "Concluído"; }).length;
    var pct = total ? Math.round((concluidas / total) * 100) : 0;

    var el = document.getElementById("statsRow");
    el.innerHTML = '<div class="stats-month-lbl">Estatísticas de ' + MONTHS[viewMonth] + ' de ' + viewYear + ' (por data de postagem)</div>';
    [
      { num: total, lbl: "tarefas no mês" },
      { num: pendentes, lbl: "pendentes" },
      { num: emProducao, lbl: "em produção agora" },
      { num: concluidas + " (" + pct + "%)", lbl: "concluídas no mês" }
    ].forEach(function (s) {
      var card = document.createElement("div"); card.className = "stat-card";
      card.innerHTML = '<div class="stat-num">' + s.num + '</div><div class="stat-lbl">' + s.lbl + '</div>';
      el.appendChild(card);
    });
  }

  // ---------- Persistence (shared "db" capability, with local fallback) ----------
  function setSyncStatus(mode) {
    var el = document.getElementById("syncStatus");
    var txt = document.getElementById("syncStatusText");
    el.style.display = "inline-flex";
    if (mode === "synced") { el.classList.remove("local"); txt.textContent = "Sincronizado com a equipe"; }
    else { el.classList.add("local"); txt.textContent = "Salvo neste navegador"; }
  }
  function docToPerson(d) { var v = d.data() || {}; return { id: d.id, name: v.name || "", whatsapp: v.whatsapp || "" }; }
  function docToCategory(d) { var v = d.data() || {}; return { id: d.id, name: v.name || "" }; }
  function docToTask(d) {
    var v = d.data() || {};
    return { id: d.id, title: v.title || "", format: v.format || "imagem", categoryId: v.categoryId || "", ownerId: v.ownerId || "", priority: v.priority || "Média", prodDate: v.prodDate || "", postDate: v.postDate || "", stage: v.stage || "Backlog", notes: v.notes || "" };
  }
  function docToMural(d) { var v = d.data() || {}; return { id: d.id, authorId: v.authorId || "", message: v.message || "", createdAt: v.createdAt || new Date().toISOString() }; }

  var LOCAL_STORAGE_KEY = "chamego_kanban_v1";
  function saveLocal() {
    try { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }
  function seedLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (raw) { state = JSON.parse(raw); return; }
    } catch (e) { /* fall through to defaults */ }
    state = defaultState();
    saveLocal();
  }

  async function seedDbIfEmpty() {
    var snap = await dbApi.collection("people").limit(1).get();
    if (!snap.empty) return;
    var seed = defaultState();
    var writes = [];
    seed.people.forEach(function (p) { writes.push(dbApi.collection("people").doc(p.id).set({ name: p.name, whatsapp: p.whatsapp || "" })); });
    seed.categories.forEach(function (c) { writes.push(dbApi.collection("categories").doc(c.id).set({ name: c.name })); });
    seed.tasks.forEach(function (t) {
      writes.push(dbApi.collection("tasks").doc(t.id).set({ title: t.title, format: t.format, categoryId: t.categoryId, ownerId: t.ownerId, priority: t.priority, prodDate: t.prodDate, postDate: t.postDate, stage: t.stage, notes: t.notes }));
    });
    seed.mural.forEach(function (m) { writes.push(dbApi.collection("mural").doc(m.id).set({ authorId: m.authorId, message: m.message, createdAt: m.createdAt })); });
    await Promise.all(writes);
  }

  function subscribeDb() {
    dbApi.collection("people").onSnapshot(function (snap) { state.people = snap.docs.map(docToPerson); renderCurrentTab(); }, function () { setSyncStatus("local"); });
    dbApi.collection("categories").onSnapshot(function (snap) { state.categories = snap.docs.map(docToCategory); renderCurrentTab(); }, function () { setSyncStatus("local"); });
    dbApi.collection("tasks").onSnapshot(function (snap) { state.tasks = snap.docs.map(docToTask); renderCurrentTab(); }, function () { setSyncStatus("local"); });
    dbApi.collection("mural").onSnapshot(function (snap) { state.mural = snap.docs.map(docToMural); renderCurrentTab(); }, function () { setSyncStatus("local"); });
  }

  async function initData() {
    try { if (typeof claude !== "undefined" && claude.use) { dbApi = await claude.use("db"); } } catch (e) { dbApi = null; }
    if (dbApi) {
      usingDb = true; setSyncStatus("synced");
      try { await seedDbIfEmpty(); subscribeDb(); }
      catch (e) { usingDb = false; setSyncStatus("local"); seedLocal(); renderCurrentTab(); }
    } else { usingDb = false; setSyncStatus("local"); seedLocal(); renderCurrentTab(); }
  }

  async function upsertPerson(id, data) {
    if (usingDb) {
      if (id) { await dbApi.collection("people").doc(id).set(data); return id; }
      var ref = await dbApi.collection("people").add(data); return ref.id;
    }
    if (id) { var p = state.people.find(function (x) { return x.id === id; }); if (p) Object.assign(p, data); }
    else { id = uid("p"); state.people.push(Object.assign({ id: id }, data)); }
    saveLocal(); renderCurrentTab(); return id;
  }
  async function removePerson(id) {
    if (usingDb) { await dbApi.collection("people").doc(id).delete(); }
    else { state.people = state.people.filter(function (p) { return p.id !== id; }); saveLocal(); }
    if (filters.personId === id) filters.personId = "all";
    renderCurrentTab();
  }
  async function upsertCategory(id, name) {
    if (usingDb) { if (id) { await dbApi.collection("categories").doc(id).set({ name: name }); return id; } var ref = await dbApi.collection("categories").add({ name: name }); return ref.id; }
    if (id) { var c = state.categories.find(function (x) { return x.id === id; }); if (c) c.name = name; }
    else { id = uid("c"); state.categories.push({ id: id, name: name }); }
    saveLocal(); renderCurrentTab(); return id;
  }
  async function upsertTask(id, data) {
    if (usingDb) { if (id) { await dbApi.collection("tasks").doc(id).set(data); return id; } var ref = await dbApi.collection("tasks").add(data); return ref.id; }
    if (id) { var t = state.tasks.find(function (x) { return x.id === id; }); if (t) Object.assign(t, data); }
    else { id = uid("t"); state.tasks.push(Object.assign({ id: id }, data)); }
    saveLocal(); renderCurrentTab(); return id;
  }
  async function removeTaskById(id) {
    if (usingDb) { await dbApi.collection("tasks").doc(id).delete(); }
    else { state.tasks = state.tasks.filter(function (t) { return t.id !== id; }); saveLocal(); renderCurrentTab(); }
  }
  async function addMuralPost(authorId, message) {
    var data = { authorId: authorId, message: message, createdAt: new Date().toISOString() };
    if (usingDb) { await dbApi.collection("mural").add(data); }

  // ---------- Monthly calendar ----------
  document.getElementById("prevMonth").addEventListener("click", function () { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderMonthCalendar(); renderStats(); });
  document.getElementById("nextMonth").addEventListener("click", function () { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderMonthCalendar(); renderStats(); });
  document.getElementById("todayBtn").addEventListener("click", function () { var t = new Date(); viewYear = t.getFullYear(); viewMonth = t.getMonth(); renderMonthCalendar(); renderStats(); });

  function renderMonthCalendar() {
    document.getElementById("calTitle").textContent = MONTHS[viewMonth] + " " + viewYear;
    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    WEEKDAYS.forEach(function (w) { var el = document.createElement("div"); el.className = "cal-weekday"; el.textContent = w; grid.appendChild(el); });

    var firstDay = new Date(viewYear, viewMonth, 1);
    var startWeekday = firstDay.getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    var totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
    var tISO = todayISO();
    var tasks = filteredTasks(true);

    for (var i = 0; i < totalCells; i++) {
      var outside = false;
      var dayNum = i - startWeekday + 1;
      var cy = viewYear, cm = viewMonth;
      if (dayNum < 1) { outside = true; cm = viewMonth - 1; cy = viewYear; if (cm < 0) { cm = 11; cy = viewYear - 1; } dayNum = daysInPrevMonth + dayNum; }
      else if (dayNum > daysInMonth) { outside = true; dayNum = dayNum - daysInMonth; cm = viewMonth + 1; cy = viewYear; if (cm > 11) { cm = 0; cy = viewYear + 1; } }
      var iso = toISO(cy, cm, dayNum);

      var cell = document.createElement("div");
      cell.className = "cal-cell" + (outside ? " outside" : "") + (iso === tISO ? " today" : "");

      var row = document.createElement("div"); row.className = "cal-daynum-row";
      var numEl = document.createElement("span"); numEl.className = "cal-daynum"; numEl.textContent = dayNum;
      var addEl = document.createElement("button"); addEl.className = "cal-add"; addEl.textContent = "+"; addEl.title = "Adicionar tarefa neste dia";
      addEl.addEventListener("click", function (isoCapture) { return function (e) { e.stopPropagation(); var presets = {}; presets[dateMode === "prod" ? "prodDate" : "postDate"] = isoCapture; openTaskModal(null, presets); }; }(iso));
      row.appendChild(numEl); row.appendChild(addEl);
      cell.appendChild(row);

      var dayTasks = tasks.filter(function (t) { return dateField(t) === iso; });
      var chipsEl = document.createElement("div"); chipsEl.className = "cal-chips";
      var shown = dayTasks.slice(0, 4);
      shown.forEach(function (t) {
        var chip = document.createElement("div"); chip.className = "chip fmt-" + t.format; chip.textContent = t.title;
        chip.title = t.title + " — " + personName(t.ownerId);
        chip.addEventListener("click", function (id) { return function (e) { e.stopPropagation(); openTaskModal(id); }; }(t.id));
        chipsEl.appendChild(chip);
      });
      cell.appendChild(chipsEl);
      if (dayTasks.length > shown.length) { var more = document.createElement("div"); more.className = "cal-more"; more.textContent = "+" + (dayTasks.length - shown.length) + " mais"; cell.appendChild(more); }

      cell.addEventListener("click", function (isoCapture) { return function () { var presets = {}; presets[dateMode === "prod" ? "prodDate" : "postDate"] = isoCapture; openTaskModal(null, presets); }; }(iso));
      grid.appendChild(cell);
    }
  }

  // ---------- Progress & deadlines ----------
  function renderProgress() {
    var body = document.getElementById("progressBody");
    body.innerHTML = "";
    var pending = filteredTasks(true).filter(function (t) { return t.stage !== "Concluído"; });
    if (!pending.length) { body.innerHTML = '<div class="empty-hint">Tudo em dia! Não há tarefas pendentes com esses filtros.</div>'; return; }
    var groups = {};
    pending.forEach(function (t) { var key = t.postDate || "sem-prazo"; if (!groups[key]) groups[key] = []; groups[key].push(t); });
    var keys = Object.keys(groups).sort(function (a, b) { if (a === "sem-prazo") return 1; if (b === "sem-prazo") return -1; return a.localeCompare(b); });
    var tISO = todayISO();

    keys.forEach(function (key) {
      var groupEl = document.createElement("div"); groupEl.className = "day-group";
      var head = document.createElement("div"); head.className = "day-group-head";
      if (key === "sem-prazo") head.textContent = "Sem prazo definido";
      else {
        var diff = daysBetween(tISO, key);
        var rel = diff === 0 ? " · hoje" : diff > 0 ? " · em " + diff + " dia" + (diff > 1 ? "s" : "") : " · atrasado " + Math.abs(diff) + " dia" + (Math.abs(diff) > 1 ? "s" : "");
        head.textContent = longDate(key) + rel;
      }
      groupEl.appendChild(head);

      groups[key].forEach(function (t) {
        var stageIdx = STAGES.indexOf(t.stage);
        var pct = Math.round((stageIdx / (STAGES.length - 1)) * 100);
        var status = "ok";
        if (key !== "sem-prazo") { var d2 = daysBetween(tISO, key); if (d2 < 0) status = "overdue"; else if (d2 === 0) status = "today"; }
        var row = document.createElement("div"); row.className = "progress-row";
        row.addEventListener("click", function () { openTaskModal(t.id); });

        var top = document.createElement("div"); top.className = "progress-top";
        var left = document.createElement("div");
        left.style.display = "flex"; left.style.alignItems = "center"; left.style.gap = "8px"; left.style.flexWrap = "wrap";
        left.innerHTML =
          '<span class="chip fmt-' + t.format + '" style="cursor:default;">' + FORMAT_LABEL[t.format] + '</span>' +
          '<span class="prio-pill ' + priorityClass(t.priority) + '">' + t.priority + '</span>' +
          '<span class="task-title">' + t.title + '</span>' +
          '<span class="avatar">' + initials(personName(t.ownerId)) + '</span>';
        var tag = document.createElement("span");
        tag.className = "deadline-tag " + (status === "overdue" ? "deadline-overdue" : status === "today" ? "deadline-today" : "deadline-ok");
        tag.textContent = t.stage;
        top.appendChild(left); top.appendChild(tag);
        row.appendChild(top);

        var track = document.createElement("div"); track.className = "progress-track";
        var fill = document.createElement("div"); fill.className = "progress-fill" + (status === "overdue" ? " overdue" : "");
        fill.style.width = pct + "%";
        track.appendChild(fill);
        row.appendChild(track);

        groupEl.appendChild(row);
      });
      body.appendChild(groupEl);
    });
  }

    var authorSel = document.getElementById("muralAuthor");
    authorSel.innerHTML = "";
    state.people.forEach(function (p) { var opt = document.createElement("option"); opt.value = p.id; opt.textContent = p.name; authorSel.appendChild(opt); });

    var body = document.getElementById("muralBody");
    body.innerHTML = "";
    var posts = state.mural.slice().sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
    if (!posts.length) { body.innerHTML = '<div class="empty-hint">Nenhum recado ainda. Seja a primeira a escrever algo pra equipe!</div>'; return; }
    posts.forEach(function (m) {
      var row = document.createElement("div"); row.className = "mural-post";
      var av = document.createElement("span"); av.className = "avatar"; av.textContent = initials(personName(m.authorId));
      row.appendChild(av);
      var b = document.createElement("div"); b.className = "mp-body";
      var head = document.createElement("div"); head.className = "mp-head";
      head.innerHTML = '<span class="mp-name">' + personName(m.authorId) + '</span><span class="mp-time">' + formatDateTime(m.createdAt) + '</span>';
      var delBtn = document.createElement("button"); delBtn.className = "icon-btn"; delBtn.textContent = "✕"; delBtn.title = "Excluir recado";
      delBtn.addEventListener("click", function () { removeMuralPost(m.id); });
      head.appendChild(delBtn);
      var textEl = document.createElement("div"); textEl.className = "mp-text"; textEl.textContent = m.message;
      b.appendChild(head); b.appendChild(textEl);
      row.appendChild(b);
      body.appendChild(row);
    });
  }

  document.getElementById("muralPostBtn").addEventListener("click", function () {
    var authorSel = document.getElementById("muralAuthor");
    var textEl = document.getElementById("muralText");
    var msg = textEl.value.trim();
    if (!msg) { textEl.focus(); return; }
    if (!authorSel.value) return;
    addMuralPost(authorSel.value, msg);
    textEl.value = "";
  });

  // ---------- Task modal ----------
  function openTaskModal(taskId, presets) {
    editingTaskId = taskId;
    presets = presets || {};
    if (taskId) {
      var t = state.tasks.find(function (x) { return x.id === taskId; });
      modalTitle.textContent = "Editar tarefa";
      fTitle.value = t.title;
      fFormat.value = t.format;
      populateCategorySelect(t.categoryId);
      populateOwnerSelect(t.ownerId);
      fPriority.value = t.priority || "Média";
      fProd.value = t.prodDate || "";
      fPost.value = t.postDate || "";
      fStage.value = t.stage;
      fNotes.value = t.notes || "";
      deleteBtn.style.display = "inline-block";
    } else {
      modalTitle.textContent = "Nova tarefa";
      fTitle.value = "";
      fFormat.value = presets.format || "reels";
      populateCategorySelect(state.categories[0] && state.categories[0].id);
      populateOwnerSelect(presets.ownerId || (state.people[0] && state.people[0].id));
      fPriority.value = "Média";
      fProd.value = presets.prodDate || "";
      fPost.value = presets.postDate || "";
      fStage.value = presets.stage || "Backlog";
      fNotes.value = "";
      deleteBtn.style.display = "none";
    }
    overlay.classList.add("open");
    setTimeout(function () { fTitle.focus(); }, 30);
  }

  function closeModal() { overlay.classList.remove("open"); editingTaskId = null; }

  var saveBtnEl = document.getElementById("saveBtn");

  async function saveTask() {
    var title = fTitle.value.trim();
    if (!title) { fTitle.focus(); return; }
    if (fOwner.value === "__add__" || fCategory.value === "__add__") return;
    var data = { title: title, format: fFormat.value, categoryId: fCategory.value, ownerId: fOwner.value, priority: fPriority.value, prodDate: fProd.value || "", postDate: fPost.value || "", stage: fStage.value, notes: fNotes.value.trim() };
    saveBtnEl.disabled = true;
    try { await upsertTask(editingTaskId, data); closeModal(); } finally { saveBtnEl.disabled = false; }
  }
  async function deleteTask(id) { await removeTaskById(id); closeModal(); }

  saveBtnEl.addEventListener("click", saveTask);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  deleteBtn.addEventListener("click", function () { if (editingTaskId) deleteTask(editingTaskId); });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (overlay.classList.contains("open")) closeModal();
    if (document.getElementById("personOverlay").classList.contains("open")) closePersonModal();
    if (document.getElementById("categoryOverlay").classList.contains("open")) closeCategoryModal();
    if (document.getElementById("confirmOverlay").classList.contains("open")) closeConfirm();
    if (document.getElementById("peopleOverlay").classList.contains("open")) closePeopleManager();
  });

  document.getElementById("quickAddBtn").addEventListener("click", function () { openTaskModal(null, {}); });

  switchTab("calendar");
  initData();
})();
</script>

</body>
</html>
